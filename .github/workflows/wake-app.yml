name: Wake Streamlit App

on:
  schedule:
    - cron: "0 */4 * * *"   # каждые 4 часа
  workflow_dispatch:          # чтобы можно было запустить вручную

jobs:
  wake:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install chromium --with-deps   # устанавливает браузер

      - name: Run keepalive script
        run: python scripts/keepalive.py
